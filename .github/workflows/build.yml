
name: Construire l'APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Prendre le dernier zip envoyé
        run: |
          ZIP=$(git log --diff-filter=AM --name-only --pretty=format: -- '*.zip' | grep -v '^$' | head -1)
          echo "Zip utilisé : $ZIP"
          unzip -o "$ZIP" -d projet
          grep versionName projet/app/build.gradle
      - run: gradle assembleRelease --no-daemon
        working-directory: projet
      - run: cp projet/app/build/outputs/apk/release/app-release.apk sors-moi-${{ github.run_number }}.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Sors-moi build ${{ github.run_number }}
          files: sors-moi-${{ github.run_number }}.apk
          make_latest: true
