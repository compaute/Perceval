name: Construire l'APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - run: unzip -o sors-moi-android.zip -d projet
      - run: gradle assembleRelease --no-daemon
        working-directory: projet
      - run: cp projet/app/build/outputs/apk/release/app-release.apk sors-moi.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          files: sors-moi.apk
